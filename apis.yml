apis:
- aid: hiscox:hiscox-eligibility-api
  name: Hiscox Eligibility API
  description: >-
    Partner-facing eligibility lookup that returns the list of US states and the
    Hiscox products offered by profession, used to determine whether a risk can
    be quoted before a quote is requested. Listed as Active on the public Hiscox
    Developer Portal API catalog; reference documentation and the OpenAPI/Swagger
    definition are behind the partner login and were not retrievable.
  humanURL: https://developer.hiscox.com/apis
  tags:
  - Eligibility
  - Underwriting
  - Insurance
  properties:
  - type: Documentation
    url: https://developer.hiscox.com/apis
  - type: APIReference
    url: https://developer.hiscox.com/documentation
- aid: hiscox:hiscox-quote-api
  name: Hiscox Quote API v4
  description: >-
    Partner-facing quoting API that returns a competitive general liability,
    professional liability, business owner's policy (BOP) and/or cyber quote for
    purchase via partner portals or APIs. Listed as Active on the public Hiscox
    Developer Portal API catalog; access is granted only after approval by a
    Hiscox Partnership Manager, and the reference documentation and
    OpenAPI/Swagger definition are behind the partner login.
  humanURL: https://developer.hiscox.com/apis
  tags:
  - Quote
  - Rating
  - Property and Casualty
  - Cyber Insurance
  properties:
  - type: Documentation
    url: https://developer.hiscox.com/apis
  - type: APIReference
    url: https://developer.hiscox.com/documentation
- aid: hiscox:hiscox-setup-payment-api
  name: Hiscox Setup Payment API
  description: >-
    Partner-facing payment API that initiates the Hiscox policy payment process,
    completing the quote-to-buy flow for partner-distributed small business
    policies. Listed as Active on the public Hiscox Developer Portal API catalog;
    reference documentation and the OpenAPI/Swagger definition are behind the
    partner login.
  humanURL: https://developer.hiscox.com/apis
  tags:
  - Payments
  - Bind
  - Billing
  properties:
  - type: Documentation
    url: https://developer.hiscox.com/apis
  - type: APIReference
    url: https://developer.hiscox.com/documentation
