name: Hiscox
kind: company
description: >-
  Hiscox Ltd is a diversified international specialist insurance and reinsurance
  group with roots in the Lloyd's of London market dating to 1901, domiciled in
  Bermuda and listed on the London Stock Exchange, operating from 31 offices
  across 13 countries. Its home market is the United Kingdom, where it underwrites
  through three segments: Hiscox Retail (small business, professional and
  specialty personal lines sold direct and through brokers in the UK, Europe and
  the USA), Hiscox London Market (larger and more complex specialty risks written
  out of London for a worldwide client base, including marine, energy, aviation,
  specialty property and casualty, and cyber), and Hiscox Re & ILS (reinsurance
  and insurance-linked securities). Its API posture is partner-gated rather than
  public. Hiscox operates a genuine first-party developer portal at
  developer.hiscox.com serving its US small-business arm, and that portal
  publicly enumerates three active APIs - Eligibility, Quote v4 and Setup Payment
  - but every reference document, sandbox credential and OpenAPI/Swagger file
  sits behind a login that is only issued after a Hiscox Partnership Manager
  approves a commercial partnership. There is no self-serve signup, no
  downloadable specification, no public claims or FNOL API, and no developer
  surface at all on the UK or London Market side of the group, where business is
  placed through brokers. Hiscox's most concrete open-standards footprint is
  ACORD rather than REST: in July 2025 ACORD and Howden announced that ACORD
  Standards for digital accounting and invoicing went live in the UK retail
  insurance market with Hiscox as the receiving insurer, responding in real time
  to Howden's digital invoices through the ACORD Solutions Group ADEPT (ACORD
  Data Exchange Platform & Translator) receiver portal.
