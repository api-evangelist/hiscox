  - type: APIReference
    url: https://developer.hiscox.com/documentation
- aid: hiscox:hiscox-setup-payment-api
  name: Hiscox Setup Payment API
  description: Partner-facing payment API that initiates the Hiscox policy payment process, completing
    the quote-to-buy flow for partner-distributed small business policies. Listed as Active on the public
    Hiscox Developer Portal API catalog; reference documentation and the OpenAPI/Swagger definition are
    behind the partner login.
  humanURL: https://developer.hiscox.com/apis
  tags:
  - Payments
  - Bind
  - Billing
  properties:
  - type: Documentation
    url: https://developer.hiscox.com/apis
  - type: APIReference
    url: https://developer.hiscox.com/documentation
- aid: hiscox:hiscox-cargo-api
  name: Hiscox Cargo API
  description: Hiscox London Market API-based solution for underwriting small cargo and stock throughput
    risks, launched 30 June 2025 and distributed through broker partners acting as coverholders. Provides
    near-instant quote and bind for every risk within underwriting appetite, offering transit, stock only
    and stock throughput cover with a US$5 million limit and 100% Hiscox Syndicate 33 security. Hiscox
    developed the risk rating models, policy wordings and software coding in-house; Price Forbes was the
    first broker partner and built the front end. There is no developer portal listing, no public documentation
    and no specification for this API - it is announced only through the Hiscox Group newsroom and reached
    through a broker partnership.
  humanURL: https://www.hiscoxgroup.com/news/press-releases/2025/30-06-25
