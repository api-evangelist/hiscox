- id: acord-digital-accounting-invoicing
  conforms: true
  evidence: >-
    ACORD and Howden announced on 3 July 2025 that ACORD Standards for digital
    accounting and invoicing are live and operational in the UK retail insurance
    market, with Hiscox as the receiving insurer. "Through the ADEPT receiver
    portal, Hiscox can respond to the digital invoices Howden sends in real
    time." ADEPT (ACORD Data Exchange Platform & Translator) supports both XML
    and JSON messaging. This was the first use of ACORD digital accounting
    standards in the UK outside the specialty and (re)insurance market.
  source: https://www.prnewswire.co.uk/news-releases/acord-and-howden-pioneer-the-adoption-of-digital-invoicing-standards-in-the-uk-retail-insurance-market-302497211.html
  note: >-
    Broker-to-carrier and market-body facing. No ACORD, AL3, ACORD XML or NGDS
    reference appears anywhere on developer.hiscox.com - the ACORD relationship
    is not developer-facing.
- id: acturis-broker-integration
  conforms: true
  evidence: >-
    The Hiscox UK broker extranet, launched 3 March 2023, is described as "the
    first full cycle digital trading extranet built by an insurer that supports
    integration into broker's Acturis back office", with customer data downloading
    straight onto Acturis to remove re-keying.
  source: https://www.hiscoxgroup.com/news/press-releases/2023/03-03-23
  note: Agency/broker back-office data exchange, not a public API standard.
