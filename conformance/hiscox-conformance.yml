summary: >-
  Hiscox's conformance profile is a carrier profile, not a platform profile. The
  cross-cutting web standards it asserts publicly are minimal but real - REST,
  OAuth 2.0, TLS 1.2, XML and JSON - and its strongest machine-readable
  standards footprint is the insurance industry body's, not the web's: ACORD
  digital accounting and invoicing, live in UK retail insurance through the ACORD
  Solutions Group ADEPT gateway. Everything asserted below is sourced; nothing is
  inferred from an unretrievable specification.
