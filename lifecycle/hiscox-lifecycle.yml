api_milestones:
- date: '2023-03-03'
  event: >-
    Hiscox UK launches a full-cycle broker extranet - described as the first
    full-cycle digital trading extranet built by an insurer that supports
    integration into a broker's Acturis back office. Quote in seconds, new
    business, mid-term adjustments and renewals; PI Combined, CyberClear and
    Office Combined; customer data downloads straight into Acturis.
  source: https://www.hiscoxgroup.com/news/press-releases/2023/03-03-23
- date: '2025-06-30'
  event: >-
    Hiscox London Market launches the Cargo API for small cargo and stock
    throughput risks - near-instant quote and bind, 100% Hiscox Syndicate 33
    security, US$5m limit, risk models and software coded in-house. Price Forbes
    is the first broker partner and built the front end.
  source: https://www.hiscoxgroup.com/news/press-releases/2025/30-06-25
- date: '2025-07-03'
  event: >-
    ACORD Standards for digital accounting and invoicing go live in the UK retail
    insurance market with Hiscox as the receiving insurer, responding in real
    time to Howden's digital invoices through the ACORD Solutions Group ADEPT
    receiver portal.
  source: https://www.prnewswire.co.uk/news-releases/acord-and-howden-pioneer-the-adoption-of-digital-invoicing-standards-in-the-uk-retail-insurance-market-302497211.html
- date: '2025-08-06'
  event: >-
    Hiscox agrees to acquire Corix Insurance Services, LLC and Vouch Insurance
    Company from Vouch, Inc., explicitly to gain "new cutting-edge US broker
    technology to accelerate the ongoing digitization of Hiscox's US broker
    platform", with a multi-year distribution deal alongside.
  source: https://www.hiscoxgroup.com/news/press-releases/2025/06-08-25-1
