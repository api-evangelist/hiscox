summary: >-
  Hiscox publishes no API changelog, no status page, no deprecation policy and no
  SLA. What it does publish is a standing maintenance window on every developer
  portal page, product-name versioning ("Quote v4"), and an API Terms of Use that
  reserves the right to update, modify, suspend or discontinue the API Services
  at any time, with or without notice, and places the cost of adapting on the
  partner. That is the lifecycle contract, and it is a weak one - recorded here
  as published rather than inferred.
